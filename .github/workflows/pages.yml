# Публикация сайта. В настройках репозитория Pages берёт ветку gh-pages,
# поэтому при каждом пуше в main переносим туда содержимое public/.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push public/ to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd public
          git init -b gh-pages -q
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
